name: Wave Factory Essentials tester builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tester-builds.yml"
      - "CMakeLists.txt"
      - "dsp/**"
      - "packaging/**"
      - "plugins/Goodband/**"
      - "plugins/PitchTrails/**"
      - "scripts/package-windows.ps1"
      - "tests/**"
      - "third_party/iPlug2"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download plug-in SDK dependencies
        shell: bash
        working-directory: third_party/iPlug2/Dependencies/IPlug
        run: |
          ./download-vst3-sdk.sh
          ./download-clap-sdks.sh 1.2.10

      - name: Configure Windows x64
        run: >-
          cmake -S . -B build/windows
          -G "Visual Studio 17 2022" -A x64
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DBUILD_TESTING=ON

      - name: Build plug-ins and tests
        run: >-
          cmake --build build/windows --config Release
          --target Goodband-vst3 Goodband-clap PitchTrails-vst3 PitchTrails-clap wave_factory_dsp_tests goodband_character_preset_tests

      - name: Run tests
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Package Windows tester build
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload Windows tester ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Threefold-Palm-Windows-x64
          path: dist/Threefold-Palm-*-Windows-x64.zip
          if-no-files-found: error
